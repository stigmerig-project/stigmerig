[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stigmerig"
version = "0.1.4"
description = "Sovereign, local-first multi-agent stigmergy coordination engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "StigmeRig Contributors" }
]
keywords = ["stigmergy", "multi-agent", "coordination", "swarm", "worktree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/stigmerig-project/stigmerig"
Repository = "https://github.com/stigmerig-project/stigmerig"
Issues = "https://github.com/stigmerig-project/stigmerig/issues"

[project.scripts]
stigmerig = "stigmerig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
